[project]
name = "relation-extraction-sikdd"
version = "0.1.0"
description = "Relation extraction with GLiNER2: data prep, fine-tuning, zero-shot and few-shot evaluation."
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "gliner2",
    "torch",
    "pyyaml",
    "numpy",
    "scikit-learn",
]

[dependency-groups]
dev = [
    "pytest",
    "ruff",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/relation_extraction"]
